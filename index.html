<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>DDS Abril Verde 2026 | AR</title>
    <script src="/aframe.min.js"></script>
    <script src="/mindar-image-aframe.prod.js"></script>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>

    <!-- Controle de HUD (Áudio e Vídeo) — FIXO NO TOPO DO BODY -->
    <div id="controls-ui">
      <button id="audio-btn" title="Alternar som">
        <svg id="icon-sound-on" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
        <svg id="icon-sound-off" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <path d="M11 5L6 9H2V15H6L11 19V5Z"></path>
          <line x1="23" y1="9" x2="17" y2="15"></line>
          <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>
      </button>

      <button id="video-btn" title="Ver vídeo do DDS">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
      </button>

      <audio id="main-audio" src="/audio.m4a" loop preload="auto"></audio>
    </div>

    <!-- Modal de Vídeo -->
    <div id="video-modal" style="display:none">
      <div class="video-container">
        <button id="video-close">&times;</button>
        <video id="dds-video" src="/video.mp4" controls preload="auto"></video>
      </div>
    </div>

    <a-scene
      mindar-image="imageTargetSrc: /targets.mind; autoStart: false; uiLoading: no; uiError: no; uiScanning: no; filterMinCF: 0.001; filterBeta: 0.01; missTolerance: 25; warmupSteps: 8;"
      color-space="sRGB"
      renderer="colorManagement: true; physicallyCorrectLights: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >

      <a-assets>
        <img id="img-checklist" src="/checklist.png"  crossorigin="anonymous" />
        <img id="img-simbolo"   src="/simbolo.PNG"    crossorigin="anonymous" />
        <img id="img-label"     src="/label-dds.png"  crossorigin="anonymous" />
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <!-- CONTORNO NEON — Plano levemente maior atras do preto -->
        <a-plane position="0 -0.10 -0.015" width="1.96" height="5.26" material="color: #00E676; opacity: 1.0; transparent: false; side: double"></a-plane>
        
        <!-- FUNDO PRETO TRANSLUCIDO -->
        <a-plane position="0 -0.10 -0.01" width="1.90" height="5.20" material="color: #000000; opacity: 0.78; transparent: true; side: double"></a-plane>
        <a-image src="#img-checklist" position="0 1.00 0" width="1.80" height="1.80" transparent="true"></a-image>
        <a-image src="#img-simbolo" position="0 -0.70 0" width="1.70" height="1.70" transparent="true" opacity="0.98"></a-image>
        <a-image src="#img-label" position="0 -1.72 0" width="1.80" height="0.38" transparent="true"></a-image>
      </a-entity>

    </a-scene>

    <!-- Tela inicial -->
    <div id="start-ui">
      <div class="start-content">
        <div class="start-ring"></div>
        <div class="start-ring ring-2"></div>
        <p class="start-label">DDS ABRIL VERDE 2026</p>
        <button id="start-btn">&#9654; TOQUE PARA INICIAR</button>
        <p class="start-sub">Segurança na palma da mão</p>
      </div>
    </div>

    <!-- UI de Scanning -->
    <div id="scanning-ui" style="display:none">
      <div class="scanning-content">
        <div class="scan-ring"></div>
        <div class="scan-ring ring-2"></div>
        <p class="scan-text">Aponte para o marcador</p>
        <p class="scan-sub">Encaixe o símbolo no centro</p>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
